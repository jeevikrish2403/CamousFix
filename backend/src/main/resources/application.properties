spring.application.name=campusfix-backend

# Database
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/campusfix_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Jeevitha@2006}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File storage
app.upload.dir=${UPLOAD_DIR:uploads/}

# JWT
app.jwt.secret=${JWT_SECRET:campusfix_super_secret_key_2024_should_be_at_least_256_bits_long}
app.jwt.expiration=86400000

# Server
server.port=${PORT:8080}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
