spring.application.name=campusfix-backend

# MySQL Configuration - uses env vars in production, falls back to local
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/campusfix_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Jeevitha@2006}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File storage path
app.upload.dir=uploads/

# JWT Configuration
app.jwt.secret=${JWT_SECRET:campusfix_super_secret_key_2024_should_be_at_least_256_bits_long}
app.jwt.expiration=86400000

# Server
server.port=${PORT:8080}

# CORS - allows both local and deployed frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
