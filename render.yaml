services:
  # Backend - Spring Boot
  - type: web
    name: campusfix-backend
    runtime: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/campusfix-backend-1.0.0.jar
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusfix-db
          property: connectionString
      - key: JWT_SECRET
        value: campusfix_super_secret_key_2024_should_be_at_least_256_bits_long
      - key: CORS_ALLOWED_ORIGINS
        value: https://campusfix.vercel.app

  # Frontend - React/Vite Static Site
  - type: web
    name: campusfix-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://campusfix-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: campusfix-db
    databaseName: campusfix
    user: campusfix
