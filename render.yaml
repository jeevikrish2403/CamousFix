services:
  - type: web
    name: campusfix-backend
    runtime: java
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/campusfix-backend-1.0.0.jar
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusfix-db
          property: connectionString
      - key: JWT_SECRET
        value: campusfix_super_secret_key_2024_should_be_at_least_256_bits_long
      - key: CORS_ALLOWED_ORIGINS
        value: https://jeevikrish2403.github.io

databases:
  - name: campusfix-db
    databaseName: campusfix
    user: campusfix
